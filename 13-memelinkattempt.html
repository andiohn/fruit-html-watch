<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit HTML Watch</title>
    <style>
        :root {
            --clock-face-color: 0, 0, 0;
            --clock-opacity: 0.25; 
            --clock-blur-radius: 15px;
            --date-display: none;
            
            --clock-bg-image: none;
            --clock-bg-repeat: no-repeat;
            --clock-bg-size: auto;
            --clock-bg-position: center;
        }

        body {
            background-color: #000000; 
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            
            background-image: none;
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            transition: background-image 2s ease-in-out, background-color 2s ease-in-out, background-size 0.5s ease;
        }

        .clock-container {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            overflow: hidden; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        .background-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--clock-bg-image);
            background-repeat: var(--clock-bg-repeat);
            background-size: var(--clock-bg-size);
            background-position: var(--clock-bg-position);
        }

        .liquid-glass-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            z-index: 5;
            background-color: rgba(var(--clock-face-color), var(--clock-opacity));
            backdrop-filter: blur(var(--clock-blur-radius));
            -webkit-backdrop-filter: blur(var(--clock-blur-radius));
        }

        .clock-container.hidden { opacity: 0; }
        
        .date-display {
            display: var(--date-display);
            position: absolute;
            top: 75px; left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: var(--clock-bg-color, black);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .ticks { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; }
        .tick {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            width: 2px; height: 10px;
            top: 0; left: 50%;
            transform-origin: center 175px;
            margin-left: -1px;
        }
        .tick.major { background: #ffffff; width: 4px; height: 15px; margin-left: -2px; }
        .numbers { position: absolute; width: 100%; height: 100%; z-index: 10; }
        .num {
            position: absolute;
            width: 40px; height: 40px;
            text-align: center; line-height: 40px;
            font-size: 32px; font-weight: 500;
            left: 50%; top: 50%;
            margin-left: -20px; margin-top: -20px;
        }
        .hand {
            position: absolute;
            left: 50%; bottom: 50%;
            transform-origin: bottom center;
            border-radius: 10px; z-index: 10;
        }
        .hour-hand { width: 8px; height: 80px; background: #ffffff; margin-left: -4px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .minute-hand { width: 6px; height: 120px; background: #ffffff; margin-left: -3px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .second-hand { width: 2px; height: 140px; background: #ff9500; margin-left: -1px; z-index: 11; }
        .second-hand::after {
            content: ''; position: absolute;
            width: 8px; height: 8px;
            background: #ff9500; border-radius: 50%;
            bottom: -20px; left: 50%; margin-left: -4px;
        }
        .center-cap {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: rgba(var(--clock-face-color), var(--clock-opacity));
            border: 2px solid #ff9500;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
        }

        .footer-link {
            position: fixed; bottom: 30px; opacity: 0;
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: rgba(255, 255, 255, 0.75);
            font-size: 14px; font-weight: 400;
            transition: opacity 1s ease, left 0.5s ease, right 0.5s ease;
            z-index: 100; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .footer-link:hover { color: rgba(255, 255, 255, 1); }
        .footer-link svg { fill: currentColor; width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
        .pos-left { left: 30px; right: auto; }
        .pos-right { left: auto; right: 30px; }
    </style>
</head>

_just_graduated"],["yaoming",2,0,"_"],["yallgot",2,0,"y'all_got_any_more_of_them"],["yodawg",2,0,"_"],["yuno",2,0,"Y_U_NO"],["zero-wing",1,0,"_"]];

    const MEMEGEN_REGISTRY = RAW_REGISTRY.map(t => ({
        id: t[0], lines: t[1], animated: t[2] === 1, top: t[3]
    }));

    function sanitizeMemeText(text) {
        if (!text || text === "_") return "_";
        return text
            .replace(/\?/g, "~q")
            .replace(/%/g, "~p")
            .replace(/#/g, "~h")
            .replace(/\//g, "~s")
            .replace(/\s+/g, "_")
            .replace(/-+/g, "--");
    }

    function getCurrentDateMemeStr() {
        const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sept", "oct", "nov", "dec"];
        const d = new Date();
        return `${months[d.getMonth()]}_${d.getDate()}`;
    }

    function resolveMemegenFlag(val) {
        if (!val || typeof val !== 'string' || !val.includes("memegen_random")) return val;

        const isAnimated = val.includes("animated");
        const isStatic = val.includes("static");
        const includesDate = val.includes("date");

        let pool = MEMEGEN_REGISTRY;
        if (isAnimated) {
            pool = MEMEGEN_REGISTRY.filter(t => t.animated);
        } else if (isStatic) {
            pool = MEMEGEN_REGISTRY.filter(t => !t.animated);
        }

        if (pool.length === 0) pool = MEMEGEN_REGISTRY;

        const choice = pool[Math.floor(Math.random() * pool.length)];
        const ext = choice.animated ? "gif" : "png";
        const dateStr = includesDate ? getCurrentDateMemeStr() : "today";

        let urlParts = [];
        if (choice.lines === 1) {
            urlParts.push(sanitizeMemeText(dateStr));
        } else if (choice.lines === 2) {
            const top = choice.top ? sanitizeMemeText(choice.top) : "_";
            urlParts.push(top, sanitizeMemeText(dateStr));
        } else {
            const prefixParts = choice.top ? choice.top.split('/') : ["_"];
            while (prefixParts.length < choice.lines - 1) prefixParts.push("_");
            urlParts = [...prefixParts.map(sanitizeMemeText), sanitizeMemeText(dateStr)];
        }

        return `https://api.memegen.link/images/${choice.id}/${urlParts.join("/")}.${ext}`;
    }

    const urlParams = new URLSearchParams(window.location.search);

    const resolvedBgImg1 = resolveMemegenFlag(urlParams.get('bg_img'));
    const resolvedBgImg2 = resolveMemegenFlag(urlParams.get('bg_img2'));
    const resolvedClockBgImg = resolveMemegenFlag(urlParams.get('clock_bg_img'));

    const bgImgData = [
        { url: resolvedBgImg1, mode: urlParams.get('bg_mode') || 'center' },
        { url: resolvedBgImg2, mode: urlParams.get('bg_mode2') || 'center' }
    ];
    const activeBackgrounds = bgImgData.filter(item => item.url);

    const clockBgImg = resolvedClockBgImg;
    const clockBgMode = urlParams.get('clock_bg_mode') || 'center';

    const bgColorParam = urlParams.get('bg'); 
    const blurRadiusParam = urlParams.get('blur'); 
    const dateParam = urlParams.get('date'); 

    function setClockBackground(url, mode) {
        const root = document.documentElement;
        if (url) {
            root.style.setProperty('--clock-bg-image', `url('${url}')`);
            root.style.setProperty('--clock-bg-size', mode);
        } else {
            root.style.setProperty('--clock-bg-image', 'none');
        }
    }

    function setBodyBackground(url, mode) {
        const body = document.body;
        if (url) {
            body.style.backgroundImage = `url('${url}')`;
            body.style.backgroundSize = mode;
        } else {
            body.style.backgroundImage = 'none';
        }
    }

    setClockBackground(clockBgImg, clockBgMode);

    let currentBgIndex = 0;
    if (activeBackgrounds.length > 0) {
        setBodyBackground(activeBackgrounds[0].url, activeBackgrounds[0].mode);

        if (activeBackgrounds.length > 1) {
            setInterval(() => {
                currentBgIndex = (currentBgIndex + 1) % activeBackgrounds.length;
                const nextBg = activeBackgrounds[currentBgIndex];
                setBodyBackground(nextBg.url, nextBg.mode);
            }, 10000); 
        }
    }

    if (bgColorParam) {
        const hexColor = bgColorParam.replace('#', '');
        if (/^[0-9A-Fa-f]{6}\$/.test(hexColor)) {
            const r = parseInt(hexColor.substring(0, 2), 16);
            const g = parseInt(hexColor.substring(2, 4), 16);
            const b = parseInt(hexColor.substring(4, 6), 16);
            
            document.documentElement.style.setProperty('--clock-face-color', `${r}, ${g}, ${b}`);
            
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const dateDisplay = document.getElementById('date-time');
            if (luminance > 0.5) {
                dateDisplay.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
                dateDisplay.style.color = 'white';
            } else {
                dateDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
                dateDisplay.style.color = 'black';
            }
        }
    }

    if (blurRadiusParam !== null && !isNaN(blurRadiusParam)) {
        document.documentElement.style.setProperty('--clock-blur-radius', `${blurRadiusParam}px`);
    }

    if (dateParam === 'show') {
        document.documentElement.style.setProperty('--date-display', 'block');
    }

    const ticksContainer = document.getElementById('ticks-container');
    const numbersContainer = document.getElementById('numbers-container');

    for (let i = 0; i < 60; i++) {
        const tick = document.createElement('div');
        tick.className = i % 5 === 0 ? 'tick major' : 'tick';
        tick.style.transform = `rotate(${i * 6}deg)`;
        ticksContainer.appendChild(tick);
    }

    for (let i = 1; i <= 12; i++) {
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = i;
        const angle = (i * 30) * (Math.PI / 180);
        const radius = 135; 
        const x = Math.sin(angle) * radius;
        const y = -Math.cos(angle) * radius;
        num.style.transform = `translate(${x}px, ${y}px)`;
        numbersContainer.appendChild(num);
    }

    const hourHand = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');
    const dateTimeDisplay = document.getElementById('date-time');

    function updateClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondDeg = (seconds / 60) * 360;
        const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
        const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

        secondHand.style.transform = `rotate(${secondDeg}deg)`;
        minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
        hourHand.style.transform = `rotate(${hourDeg}deg)`;

        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        dateTimeDisplay.textContent = `${days[now.getDay()]} ${now.getDate()}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    const clock = document.getElementById('clock');
    let moveCount = 0;

    function moveClock() {
        clock.classList.add('hidden');
        
        setTimeout(() => {
            const maxOffset = 15; 
            const randomX = (Math.random() * (maxOffset * 2)) - maxOffset;
            const randomY = (Math.random() * (maxOffset * 2)) - maxOffset;
            
            clock.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px))`;
            
            const link = document.getElementById('gh-link');
            if (moveCount % 2 === 0) {
                link.classList.remove('pos-right');
                link.classList.add('pos-left');
            } else {
                link.classList.remove('pos-left');
                link.classList.add('pos-right');
            }
            link.style.opacity = '1';

            clock.classList.remove('hidden');
            moveCount++;
        }, 1500); 
    }

    setInterval(moveClock, 60000); 
    setTimeout(moveClock, 1000);

    const reloadParam = urlParams.get('reload_h');
    let reloadHours = parseFloat(reloadParam);
    if (isNaN(reloadHours) || reloadHours <= 0) reloadHours = 12; 
    setTimeout(() => { window.location.reload(); }, reloadHours * 3600 * 1000);
</script>
