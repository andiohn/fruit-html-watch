<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apple Watch Dynamic Screensaver</title>
    <style>
        :root {
            --clock-face-color: 0, 0, 0;
            --clock-opacity: 0.4;
            --clock-blur-radius: 15px; 
            --date-display: none;
            
            /* CSS Variables for Clock Background */
            --clock-bg-image: none;
            --clock-bg-repeat: no-repeat;
            --clock-bg-size: auto;
            --clock-bg-position: center;
        }

        body {
            background-color: #000000; 
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            
            /* Dynamic Page Background Setup */
            background-image: none;
            background-position: center;
            background-repeat: no-repeat;
            background-size: auto;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
            transition: background-image 2s ease-in-out, background-color 2s ease-in-out, background-size 0.5s ease;
        }

        /* --- Main Clock Wrapper (Positioning and Boundary) --- */
        .clock-container {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            overflow: hidden; 
            
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        /* --- CLOCK BACKGROUND OVERLAY (THE IMAGE) --- */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* z-index: -1 removed to allow for correct blurring context */
            
            background-image: var(--clock-bg-image);
            background-repeat: var(--clock-bg-repeat);
            background-size: var(--clock-bg-size);
            background-position: var(--clock-bg-position);
        }

        /* --- LIQUID GLASS BLUR LAYER (THE FIX) --- */
        /* This new element is essential: it sits on top of the image/color, 
           blurs that image, and also blurs the content behind the clock. */
        .liquid-glass-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 5; /* Sit below the ticks and hands, but above the background */

            /* Apply filter and transparent background color here */
            background-color: rgba(var(--clock-face-color), var(--clock-opacity));
            backdrop-filter: blur(var(--clock-blur-radius));
            -webkit-backdrop-filter: blur(var(--clock-blur-radius));
        }

        .clock-container.hidden {
            opacity: 0;
        }
        
        /* --- Date Complication --- */
        .date-display {
            display: var(--date-display);
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15; /* Ensure it is above the liquid glass layer (z-index: 5) */
            text-align: center;
            
            background: rgba(255, 255, 255, 0.95);
            color: var(--clock-bg-color, black);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        /* --- Clock Face Elements (Ticks, Numbers, Hands, etc. - z-index updated) --- */
        /* All these need a higher z-index (e.g., 10+) than the liquid-glass-layer (z-index: 5) */
        .ticks { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; }
        .tick {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            width: 2px;
            height: 10px;
            top: 0;
            left: 50%;
            transform-origin: center 175px;
            margin-left: -1px;
        }
        .tick.major { background: #ffffff; width: 4px; height: 15px; margin-left: -2px; }
        .numbers { position: absolute; width: 100%; height: 100%; z-index: 10; }
        .num {
            position: absolute;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
            font-size: 32px;
            font-weight: 500;
            left: 50%;
            top: 50%;
            margin-left: -20px;
            margin-top: -20px;
        }
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 10; /* Z-index is 10 for hour/minute */
        }
        .hour-hand { width: 8px; height: 80px; background: #ffffff; margin-left: -4px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .minute-hand { width: 6px; height: 120px; background: #ffffff; margin-left: -3px; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
        .second-hand { width: 2px; height: 140px; background: #ff9500; margin-left: -1px; z-index: 11; }
        .second-hand::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff9500;
            border-radius: 50%;
            bottom: -20px;
            left: 50%;
            margin-left: -4px;
        }
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: rgba(var(--clock-face-color), var(--clock-opacity));
            border: 2px solid #ff9500;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
        }

        /* --- Footer Link Styling (unchanged) --- */
        .footer-link {
            position: fixed;
            bottom: 30px;
            opacity: 0; 
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            font-weight: 400;
            transition: opacity 1s ease, left 0.5s ease, right 0.5s ease;
            z-index: 100;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .footer-link:hover { color: rgba(255, 255, 255, 1); }
        .footer-link svg { fill: currentColor; width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
        .pos-left { left: 30px; right: auto; }
        .pos-right { left: auto; right: 30px; }

    </style>
</head>

            }, FIVE_MINUTES);
        }, FIVE_MINUTES);


        // --- 7. Page Reload Logic (Custom Hours) ---
        if (reloadHours > 0) {
            const reloadTimeMs = reloadHours * 60 * 60 * 1000;

            console.log(`Scheduling full page reload in ${reloadHours} hours (${reloadTimeMs}ms).`);
            setTimeout(() => {
                console.log("Custom reload timeout reached. Reloading page.");
                // Reload the page, bypassing the cache (true) to ensure a clean start.
                location.reload(true); 
            }, reloadTimeMs); 
        } else {
            console.log("Automatic page reload is disabled.");
        }

    </script>
</body>
